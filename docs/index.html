<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordle Solver</title>
  <meta name="description" content="Enter your Wordle guesses and colours to see which words are still possible.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%236aaa64'/><text x='50' y='72' font-size='64' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Wordle Solver</h1>
    <p class="count"><strong id="count">…</strong> <span id="count-label">possible</span></p>
    <label class="toggle" title="Hide words that have already been Wordle answers">
      <input id="exclude-past" type="checkbox">
      <span>Hide past answers</span>
    </label>
    <div class="actions">
      <button id="undo" type="button" title="Remove the last guess">Undo</button>
      <button id="reset" type="button" title="Start over">Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="play" aria-label="Your guesses">
      <div id="board" class="board" role="grid"></div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <div id="keyboard" class="keyboard"></div>

      <div class="letters-block">
        <h2 class="mini-title">Common letters left</h2>
        <div id="letters" class="letters"></div>
      </div>

      <footer class="footer">
        Words: <a href="https://gist.github.com/dracos/dd0668f281e685bad51479e5acaadb93">dracos</a> ·
        <a href="https://github.com/JCA374/My-Wordle-Solver">Source</a>
      </footer>
    </section>

    <section class="results" aria-label="Suggestions">
      <div class="panel" id="split-panel" hidden>
        <h2>Narrow it down <span id="split-sub" class="sub"></span></h2>
        <ol id="split" class="word-list"></ol>
      </div>

      <div class="panel" id="explore-panel">
        <h2><span id="explore-title">Best starting words</span> <span id="explore-sub" class="sub"></span></h2>
        <ol id="explore" class="word-list"></ol>
      </div>

      <div class="panel" id="likely-panel">
        <h2>Likely answers <span class="sub" title="Words that fit every clue, most common English words first.">most common first</span></h2>
        <ol id="likely" class="word-list"></ol>
      </div>
    </section>
  </main>
</body>
</html>
